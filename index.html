---
layout: default
title: skennycomedy
---

<p></p>
<div class="intro show-dates-block">
    <div class="show-video">
	<iframe src="https://www.youtube.com/embed/4CRGbiNS5iE"
		title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write;
		       encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>

	<div class="show-dates-table">
    <table id="showstable">
	<thead>
	    <tr>
		<th colspan="3" class="show-table-heading">SHOW DATES 2026</th>
	    </tr>
	</thead>
	<tbody>
	    {% for show in site.data.shows reversed %}
	    <tr>
		<td>{{ show.date }}</td>
		<td>{{ show.venue }}</td>
		<td>{{ show.location }}</td>
	    </tr>
	    {% endfor %}
	</tbody>
    </table>
	</div>
</div>
